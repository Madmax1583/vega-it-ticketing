name: CI

on:
  push:
    branches: [ main, 'feature/*', 'secure/*', 'patch/*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy
      run: |
        pip install mypy
        mypy --ignore-missing-imports script.py report_filtering.py || true
    
    - name: Test with pytest
      run: |
        pip install pytest pytest-cov
        pytest tests/ -v --cov=report_filtering --cov-report=term-missing
    
    - name: Syntax validation
      run: |
        python -m py_compile script.py report_filtering.py
        echo "✅ All Python files compiled successfully"

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run security scan
      run: |
        pip install bandit
        bandit -r . -ll -ii
